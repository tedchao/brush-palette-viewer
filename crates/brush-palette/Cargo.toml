[package]
name = "brush-palette"
edition.workspace = true
version.workspace = true
readme.workspace = true
license.workspace = true

[dependencies]
# Existing deps from Stage B.
brush-serde.path = "../brush-serde"
brush-render.path = "../brush-render"
brush-vfs.path = "../brush-vfs"
brush-prefix-sum.path = "../brush-prefix-sum"
brush-sort.path = "../brush-sort"

burn.workspace = true

async-fn-stream.workspace = true
tokio.workspace = true
tokio-stream.workspace = true

anyhow.workspace = true
glam.workspace = true
log.workspace = true
thiserror.workspace = true

burn-fusion.workspace = true
burn-ir.workspace = true

# C2.1: shader registration + dispatch infrastructure.
# Mirrors brush-render's deps for kernels.
brush-wgsl.path = "../brush-wgsl"
brush-kernel.path = "../brush-kernel"
burn-wgpu.workspace = true
burn-cubecl.workspace = true
bytemuck = { workspace = true, features = ["derive"] }

web-time.workspace = true

# M2: native constraint optimizer (Rust port of python/constraint_optimizer.py).
# faer gives us sparse LU (L-system) + dense LU (P-system IRLS) with no
# system/Fortran deps.
# On desktop, keep faer's default features, including rayon: faer's global
# parallelism then defaults to all cores.
[target.'cfg(not(target_family = "wasm"))'.dependencies]
faer = "0.24"

# On WASM, default-features = false disables rayon, which uses OS futex ops
# unavailable there. The solver runs single-threaded.
[target.'cfg(target_family = "wasm")'.dependencies]
faer = { version = "0.24", default-features = false }

[dev-dependencies]
# tests/compare_python.rs: JSON IPC with the reference Python optimizer.
serde_json = "1"

[lints]
workspace = true